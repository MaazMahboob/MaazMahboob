<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two flagship AI systems: clinical chest X-ray computer vision and domain-grounded LLM retrieval research">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#04070C"/>
    <stop offset="55%" stop-color="#080C14"/>
    <stop offset="100%" stop-color="#0B0A18"/>
  </linearGradient>

  <linearGradient id="cvLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>

  <linearGradient id="ragLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>

  <radialGradient id="cvGlow">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="ragGlow">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".15"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity=".09"/>
  </pattern>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
  </filter>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="600" fill="url(#bg)"/>
<rect width="1200" height="600" fill="url(#grid)"/>

<circle cx="170" cy="170" r="260" fill="url(#cvGlow)">
  <animate attributeName="r" values="240;280;240" dur="7s" repeatCount="indefinite"/>
</circle>

<circle cx="1030" cy="170" r="260" fill="url(#ragGlow)">
  <animate attributeName="r" values="240;280;240" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- HEADER -->
<text x="600" y="38"
      text-anchor="middle"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="11"
      letter-spacing="3.5"
      fill="#64748B">FLAGSHIP SYSTEMS / 02</text>

<text x="600" y="72"
      text-anchor="middle"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="22"
      font-weight="700"
      fill="#E5E7EB">AI systems built around real workflows</text>

<line x1="60" y1="92" x2="1140" y2="92" stroke="#1F2937"/>

<!-- LEFT SYSTEM -->
<g filter="url(#shadow)">
  <rect x="40" y="120" width="540" height="420" rx="20"
        fill="#091017" stroke="#22D3EE" stroke-opacity=".28"/>

  <rect x="40" y="120" width="540" height="4" rx="2"
        fill="url(#cvLine)"/>
</g>

<circle cx="80" cy="160" r="28" fill="#22D3EE" opacity=".08"/>
<circle cx="80" cy="160" r="10" fill="none" stroke="#22D3EE" stroke-width="2"/>
<circle cx="80" cy="160" r="3" fill="#67E8F9" filter="url(#glow)">
  <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
</circle>

<text x="120" y="155"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="10.5"
      letter-spacing="2"
      fill="#67E8F9">COMPUTER VISION</text>

<text x="120" y="183"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="20"
      font-weight="700"
      fill="#F1F5F9">Chest X-ray AI System</text>

<text x="120" y="205"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#8190A5">Multi-disease detection + local report generation</text>

<!-- CV PIPELINE -->
<g font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">
  <line x1="75" y1="270" x2="545" y2="270"
        stroke="#263746" stroke-width="2"/>

  <line x1="75" y1="270" x2="545" y2="270"
        stroke="url(#cvLine)"
        stroke-width="2"
        stroke-dasharray="5 9">
    <animate attributeName="stroke-dashoffset"
             values="0;-140"
             dur="3s"
             repeatCount="indefinite"/>
  </line>

  <circle cx="75" cy="270" r="7" fill="#22D3EE"/>
  <circle cx="193" cy="270" r="7" fill="#22D3EE"/>
  <circle cx="310" cy="270" r="7" fill="#06B6D4"/>
  <circle cx="427" cy="270" r="7" fill="#06B6D4"/>
  <circle cx="545" cy="270" r="7" fill="#8B5CF6"/>

  <text x="75" y="245" font-size="9.5" fill="#CBD5E1">X-RAY</text>
  <text x="193" y="245" font-size="9.5" fill="#CBD5E1">YOLO</text>
  <text x="310" y="245" font-size="9.5" fill="#CBD5E1">DETECT</text>
  <text x="427" y="245" font-size="9.5" fill="#CBD5E1">REVIEW</text>
  <text x="545" y="245" font-size="9.5" fill="#CBD5E1">REPORT</text>
</g>

<text x="310" y="305"
      text-anchor="middle"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11"
      fill="#64748B">Streamlit · SQLite · Ollama</text>

<!-- CV METRICS -->
<line x1="70" y1="335" x2="550" y2="335" stroke="#263746"/>

<g font-family="JetBrains Mono,Consolas,monospace">
  <text x="70" y="375" font-size="25" font-weight="700" fill="#67E8F9">15K</text>
  <text x="70" y="395" font-size="10" fill="#718096">X-RAY IMAGES</text>

  <text x="245" y="375" font-size="25" font-weight="700" fill="#67E8F9">14</text>
  <text x="245" y="395" font-size="10" fill="#718096">ABNORMALITY CLASSES</text>

  <text x="435" y="375" font-size="25" font-weight="700" fill="#67E8F9">+30%</text>
  <text x="435" y="395" font-size="10" fill="#718096">mAP@0.5</text>
</g>

<text x="70" y="438"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#94A3B8">Computer vision pipeline for chest X-ray abnormality detection,</text>
<text x="70" y="458"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#94A3B8">with feedback and local LLM-assisted reporting.</text>

<!-- RIGHT SYSTEM -->
<g filter="url(#shadow)">
  <rect x="620" y="120" width="540" height="420" rx="20"
        fill="#0C0A18" stroke="#8B5CF6" stroke-opacity=".30"/>

  <rect x="620" y="120" width="540" height="4" rx="2"
        fill="url(#ragLine)"/>
</g>

<circle cx="660" cy="160" r="28" fill="#8B5CF6" opacity=".08"/>
<circle cx="660" cy="160" r="10" fill="none" stroke="#A78BFA" stroke-width="2"/>
<circle cx="660" cy="160" r="3" fill="#C4B5FD" filter="url(#glow)">
  <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/>
</circle>

<text x="700" y="155"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="10.5"
      letter-spacing="2"
      fill="#A78BFA">LLM / RAG RESEARCH</text>

<text x="700" y="183"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="20"
      font-weight="700"
      fill="#F1F5F9">Domain-Grounded Retrieval</text>

<text x="700" y="205"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#8190A5">Tiered retrieval + atomic claim verification</text>

<!-- RAG PIPELINE -->
<g font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">
  <line x1="655" y1="270" x2="1125" y2="270"
        stroke="#342C52" stroke-width="2"/>

  <line x1="655" y1="270" x2="1125" y2="270"
        stroke="url(#ragLine)"
        stroke-width="2"
        stroke-dasharray="5 9">
    <animate attributeName="stroke-dashoffset"
             values="0;-140"
             dur="3.2s"
             repeatCount="indefinite"/>
  </line>

  <circle cx="655" cy="270" r="7" fill="#A78BFA"/>
  <circle cx="772" cy="270" r="7" fill="#A78BFA"/>
  <circle cx="890" cy="270" r="7" fill="#8B5CF6"/>
  <circle cx="1007" cy="270" r="7" fill="#7C3AED"/>
  <circle cx="1125" cy="270" r="7" fill="#22D3EE"/>

  <text x="655" y="245" font-size="9.5" fill="#CBD5E1">QUERY</text>
  <text x="772" y="245" font-size="9.5" fill="#CBD5E1">RETRIEVE</text>
  <text x="890" y="245" font-size="9.5" fill="#CBD5E1">CLAIM CHECK</text>
  <text x="1007" y="245" font-size="9.5" fill="#CBD5E1">GROUND</text>
  <text x="1125" y="245" font-size="9.5" fill="#CBD5E1">OUTPUT</text>
</g>

<text x="890" y="305"
      text-anchor="middle"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11"
      fill="#64748B">LangGraph · RAG · claim verification</text>

<!-- RAG METRICS -->
<line x1="650" y1="335" x2="1130" y2="335" stroke="#342C52"/>

<g font-family="JetBrains Mono,Consolas,monospace">
  <text x="650" y="375" font-size="25" font-weight="700" fill="#C4B5FD">83.7%</text>
  <text x="650" y="395" font-size="10" fill="#817A99">TIMEQA V2 WIN RATE</text>

  <text x="835" y="375" font-size="25" font-weight="700" fill="#C4B5FD">78.0%</text>
  <text x="835" y="395" font-size="10" fill="#817A99">MMLU GLOBAL FACTS</text>

  <text x="1025" y="375" font-size="25" font-weight="700" fill="#C4B5FD">650</text>
  <text x="1025" y="395" font-size="10" fill="#817A99">EVALUATION QUERIES</text>
</g>

<text x="650" y="438"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#94A3B8">Research pipeline designed to reduce hallucination through</text>
<text x="650" y="458"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#94A3B8">domain-grounded retrieval and claim-level verification.</text>

<!-- SUBTLE ACTIVE SIGNALS -->
<circle cx="580" cy="270" r="2.5" fill="#22D3EE" opacity=".8">
  <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
</circle>

<circle cx="620" cy="270" r="2.5" fill="#A78BFA" opacity=".8">
  <animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/>
</circle>

<!-- FOOTER -->
<line x1="60" y1="570" x2="1140" y2="570" stroke="#1F2937"/>
<text x="600" y="590"
      text-anchor="middle"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="9.5"
      letter-spacing="1.5"
      fill="#475569">SYSTEMS / IMPLEMENTATION / EVALUATION</text>

</svg>
