<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three research publications: symptoms-based disease prediction using PubMedBERT, LLM hallucination mitigation via domain-grounded tiered retrieval, and AI-driven multi-disease diagnosis for rural healthcare">
  <defs>
    <linearGradient id="rcard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <filter id="rsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="#05070D"/>
  <text x="600" y="34" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="4" fill="#6B7280">RESEARCH &amp; PUBLICATIONS</text>

  <!-- Paper 1 -->
  <g>
    <rect x="30" y="60" width="360" height="350" rx="14" fill="url(#rcard)" stroke="#22D3EE" stroke-opacity="0.35" filter="url(#rsh)"/>
    <rect x="30" y="60" width="360" height="4" rx="2" fill="#22D3EE"/>
    <text x="54" y="94" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#22D3EE">BIOMEDICAL NLP</text>
    <text x="54" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Symptoms-Based Disease</text>
    <text x="54" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Prediction &amp; Recommendation</text>
    <text x="54" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Using NLP Query &amp; PubMedBERT</text>
    <text x="54" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B9DC3">International Journal of Info. Technology, Springer</text>
    <text x="54" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">Status: Under Review, 2026</text>

    <text x="54" y="260" font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="700" fill="#22D3EE">94.6%</text>
    <text x="54" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">test accuracy across 41 disease classes</text>

    <line x1="54" y1="305" x2="366" y2="305" stroke="#374151" stroke-opacity="0.4"/>
    <text x="54" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">Fine-tuned PubMedBERT hybrid pipeline</text>
    <text x="54" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">for disease prediction from patient queries</text>
  </g>

  <!-- Paper 2 -->
  <g>
    <rect x="420" y="60" width="360" height="350" rx="14" fill="url(#rcard)" stroke="#8B5CF6" stroke-opacity="0.35" filter="url(#rsh)"/>
    <rect x="420" y="60" width="360" height="4" rx="2" fill="#8B5CF6"/>
    <text x="444" y="94" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#8B5CF6">LLM / RAG</text>
    <text x="444" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Mitigating LLM Hallucinations</text>
    <text x="444" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">through Domain-Grounded</text>
    <text x="444" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Tiered Retrieval</text>
    <text x="444" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B9DC3">arXiv preprint, 2026</text>
    <text x="444" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">3rd of 4 authors</text>

    <text x="444" y="260" font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="700" fill="#8B5CF6">83.7%</text>
    <text x="444" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">win rate on TimeQA v2 (650 queries)</text>

    <line x1="444" y1="305" x2="756" y2="305" stroke="#374151" stroke-opacity="0.4"/>
    <text x="444" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">Four-phase LangGraph RAG pipeline with</text>
    <text x="444" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">atomic claim verification · 78.0% MMLU</text>
    <text x="444" y="386" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" fill="#8B5CF6">→ arxiv.org</text>
  </g>

  <!-- Paper 3 -->
  <g>
    <rect x="810" y="60" width="360" height="350" rx="14" fill="url(#rcard)" stroke="#06B6D4" stroke-opacity="0.35" filter="url(#rsh)"/>
    <rect x="810" y="60" width="360" height="4" rx="2" fill="#06B6D4"/>
    <text x="834" y="94" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#06B6D4">MEDICAL COMPUTER VISION</text>
    <text x="834" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">AI-Driven Multi-Disease</text>
    <text x="834" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Diagnosis Using Medical Imaging</text>
    <text x="834" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">for Rural Healthcare</text>
    <text x="834" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B9DC3">IGI Global, 2026 (book chapter)</text>
    <text x="834" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">1st author</text>

    <text x="834" y="260" font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="700" fill="#06B6D4">14</text>
    <text x="834" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">thoracic abnormalities localized</text>

    <line x1="834" y1="305" x2="1146" y2="305" stroke="#374151" stroke-opacity="0.4"/>
    <text x="834" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">YOLOv11 / Faster R-CNN system for</text>
    <text x="834" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B9DC3">resource-constrained healthcare settings</text>
    <text x="834" y="386" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" fill="#06B6D4">→ DOI link</text>
  </g>
</svg>
