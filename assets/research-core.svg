<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research core connecting biomedical NLP, LLM and RAG systems, and medical computer vision">
  <rect width="1200" height="360" fill="#05070D"/>
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- connecting lines -->
  <g stroke="#374151" stroke-width="1.5" opacity="0.6">
    <line x1="600" y1="60" x2="260" y2="180"/>
    <line x1="600" y1="60" x2="600" y2="180"/>
    <line x1="600" y1="60" x2="940" y2="180"/>
    <line x1="260" y1="180" x2="260" y2="300"/>
    <line x1="600" y1="180" x2="600" y2="300"/>
    <line x1="940" y1="180" x2="800" y2="300"/>
    <line x1="940" y1="180" x2="1080" y2="300"/>
  </g>

  <!-- root -->
  <circle cx="600" cy="60" r="42" fill="url(#nodeGlow)"/>
  <circle cx="600" cy="60" r="8" fill="#8B5CF6"/>
  <text x="600" y="35" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" letter-spacing="2" fill="#E5E7EB">RESEARCH CORE</text>

  <!-- branch 1: biomedical nlp -->
  <circle cx="260" cy="180" r="7" fill="#22D3EE"/>
  <text x="260" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E5E7EB">Biomedical NLP</text>
  <circle cx="260" cy="300" r="5" fill="#22D3EE"/>
  <text x="260" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93C5FD">PubMedBERT</text>

  <!-- branch 2: LLM / RAG -->
  <circle cx="600" cy="180" r="7" fill="#7C3AED"/>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E5E7EB">LLM / RAG Systems</text>
  <circle cx="600" cy="300" r="5" fill="#7C3AED"/>
  <text x="600" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93C5FD">LangGraph</text>

  <!-- branch 3: medical vision -->
  <circle cx="940" cy="180" r="7" fill="#06B6D4"/>
  <text x="940" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E5E7EB">Medical Computer Vision</text>
  <circle cx="800" cy="300" r="5" fill="#06B6D4"/>
  <text x="800" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93C5FD">YOLOv11 / v12</text>
  <circle cx="1080" cy="300" r="5" fill="#06B6D4"/>
  <text x="1080" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93C5FD">Faster R-CNN</text>

  <g>
    <circle cx="600" cy="60" r="42" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="20;46;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
