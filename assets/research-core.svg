<svg width="1200" height="470" viewBox="0 0 1200 470"
xmlns="http://www.w3.org/2000/svg"
role="img"
aria-label="Research and publications: biomedical NLP research paper, LLM and RAG research paper, and medical imaging book chapter">

<defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <linearGradient id="bg"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030509"/>
    <stop offset="48%" stop-color="#070B12"/>
    <stop offset="100%" stop-color="#0B0D16"/>
  </linearGradient>

  <linearGradient id="card1"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B1318"/>
    <stop offset="100%" stop-color="#070B10"/>
  </linearGradient>

  <linearGradient id="card2"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">
    <stop offset="0%" stop-color="#100D18"/>
    <stop offset="100%" stop-color="#080A10"/>
  </linearGradient>

  <linearGradient id="card3"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">
    <stop offset="0%" stop-color="#151109"/>
    <stop offset="100%" stop-color="#090B10"/>
  </linearGradient>


  <!-- ========================================================= -->
  <!-- ACCENTS -->
  <!-- ========================================================= -->

  <linearGradient id="cyan"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>

  <linearGradient id="violet"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C4B5FD"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="amber"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FDE68A"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>


  <!-- ========================================================= -->
  <!-- AMBIENT GLOWS -->
  <!-- ========================================================= -->

  <radialGradient id="glowCyan">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="glowViolet">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="glowAmber">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
  </radialGradient>


  <!-- ========================================================= -->
  <!-- EFFECTS -->
  <!-- ========================================================= -->

  <filter id="shadow"
          x="-40%" y="-40%"
          width="180%" height="180%">
    <feDropShadow
      dx="0"
      dy="10"
      stdDeviation="15"
      flood-color="#000000"
      flood-opacity=".55"/>
  </filter>

  <filter id="softGlow"
          x="-100%" y="-100%"
          width="300%" height="300%">
    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ========================================================= -->
<!-- CANVAS -->
<!-- ========================================================= -->

<rect width="1200"
      height="470"
      fill="url(#bg)"/>

<circle cx="120"
        cy="180"
        r="240"
        fill="url(#glowCyan)"/>

<circle cx="600"
        cy="180"
        r="250"
        fill="url(#glowViolet)"/>

<circle cx="1080"
        cy="180"
        r="240"
        fill="url(#glowAmber)"/>


<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<text x="600"
      y="34"
      text-anchor="middle"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="9.5"
      letter-spacing="4"
      fill="#64748B">
  RESEARCH / PUBLICATIONS
</text>

<text x="600"
      y="68"
      text-anchor="middle"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="25"
      font-weight="700"
      fill="#F8FAFC">
  RESEARCH &amp; PUBLICATIONS
</text>

<text x="600"
      y="92"
      text-anchor="middle"
      font-family="Segoe UI,Arial,sans-serif"
      font-size="11.5"
      fill="#64748B">
  BIOMEDICAL NLP · LLM / RAG · MEDICAL COMPUTER VISION
</text>

<line x1="60"
      y1="116"
      x2="1140"
      y2="116"
      stroke="#1F2937"
      stroke-opacity=".8"/>


