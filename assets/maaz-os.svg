<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAAZ.OS status panel: 3 shipped systems, 3 publications, 15000 X-rays processed, currently building next system">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid3" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="18" fill="url(#panel)" stroke="#7C3AED" stroke-opacity="0.25" filter="url(#sh2)"/>
  <rect x="1" y="1" width="1198" height="258" rx="18" fill="url(#grid3)"/>

  <circle cx="34" cy="34" r="6" fill="#7C3AED" opacity="0.7"/>
  <circle cx="56" cy="34" r="6" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="78" cy="34" r="6" fill="#22D3EE" opacity="0.7"/>
  <text x="600" y="39" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="4" fill="#93C5FD">MAAZ.OS — STATUS</text>

  <line x1="30" y1="58" x2="1170" y2="58" stroke="#374151" stroke-opacity="0.5"/>

  <g font-family="JetBrains Mono, Consolas, monospace" text-anchor="middle">
    <text x="195" y="115" font-size="34" font-weight="700" fill="#22D3EE">3</text>
    <text x="195" y="140" font-size="12" fill="#8B9DC3">shipped systems</text>

    <text x="465" y="115" font-size="34" font-weight="700" fill="#8B5CF6">3</text>
    <text x="465" y="140" font-size="12" fill="#8B9DC3">publications (2026)</text>

    <text x="735" y="115" font-size="34" font-weight="700" fill="#06B6D4">15,000</text>
    <text x="735" y="140" font-size="12" fill="#8B9DC3">X-rays processed</text>

    <text x="1005" y="115" font-size="34" font-weight="700" fill="#7C3AED">83.7%</text>
    <text x="1005" y="140" font-size="12" fill="#8B9DC3">best RAG win-rate</text>
  </g>

  <line x1="30" y1="175" x2="1170" y2="175" stroke="#374151" stroke-opacity="0.4"/>

  <text x="50" y="200" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#6B7280">CURRENT OBJECTIVE</text>
  <text x="50" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#E5E7EB">Ship production AI/ML systems — clinical vision and grounded LLM pipelines, in parallel.</text>

  <circle cx="1140" cy="216" r="5" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1120" y="221" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#22D3EE">STATUS :: ONLINE</text>
</svg>
