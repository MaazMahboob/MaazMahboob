<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chest X-ray AI system pipeline: input, vision model, detection, physician review, LLM reporting, feedback, retraining">
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="#05070D"/>

  <line x1="70" y1="140" x2="1130" y2="140" stroke="#374151" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="140" x2="1130" y2="140" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E5E7EB" text-anchor="middle">
    <!-- 1 -->
    <circle cx="90" cy="140" r="9" fill="#22D3EE"/>
    <text x="90" y="100">CHEST X-RAY</text>
    <text x="90" y="180" fill="#6B7280" font-size="11">INPUT SCAN</text>

    <!-- 2 -->
    <circle cx="270" cy="140" r="9" fill="#22D3EE"/>
    <text x="270" y="100">VISION MODEL</text>
    <text x="270" y="180" fill="#6B7280" font-size="11">YOLOv11 / v12</text>

    <!-- 3 -->
    <circle cx="450" cy="140" r="9" fill="#7C3AED"/>
    <text x="450" y="100">DETECTION</text>
    <text x="450" y="180" fill="#6B7280" font-size="11">Bounding boxes + confidence</text>

    <!-- 4 -->
    <circle cx="630" cy="140" r="9" fill="#7C3AED"/>
    <text x="630" y="100">PHYSICIAN REVIEW</text>
    <text x="630" y="180" fill="#6B7280" font-size="11">Clinician-in-the-loop UI</text>

    <!-- 5 -->
    <circle cx="810" cy="140" r="9" fill="#8B5CF6"/>
    <text x="810" y="100">LLM REPORTING</text>
    <text x="810" y="180" fill="#6B7280" font-size="11">Local LLM via Ollama</text>

    <!-- 6 -->
    <circle cx="960" cy="140" r="9" fill="#8B5CF6"/>
    <text x="960" y="100">HUMAN FEEDBACK</text>
    <text x="960" y="180" fill="#6B7280" font-size="11">Corrections logged</text>

    <!-- 7 -->
    <circle cx="1120" cy="140" r="9" fill="#06B6D4"/>
    <text x="1120" y="100">RETRAINING</text>
    <text x="1120" y="180" fill="#6B7280" font-size="11">Admin-triggered loop</text>
  </g>

  <g>
    <circle cx="90" cy="140" r="9" fill="#22D3EE" opacity="0.6">
      <animate attributeName="r" values="9;16;9" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="230" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4B5563">STREAMLIT INTERFACE · SQLITE STORAGE · ROLE-BASED ACCESS</text>
</svg>
