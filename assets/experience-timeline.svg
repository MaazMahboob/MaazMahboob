<svg width="1200" height="430" viewBox="0 0 1200 430"
xmlns="http://www.w3.org/2000/svg"
role="img"
aria-label="Chronological education and experience timeline from B.Tech in Artificial Intelligence through GNCIPL and SURE Trust internships to current AI ML career direction">

<defs>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#05070D"/>
    <stop offset="55%" stop-color="#080B12"/>
    <stop offset="100%" stop-color="#0A0B14"/>
  </linearGradient>

  <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B1720"/>
    <stop offset="100%" stop-color="#071016"/>
  </linearGradient>

  <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#120D20"/>
    <stop offset="100%" stop-color="#0A0813"/>
  </linearGradient>

  <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#081525"/>
    <stop offset="100%" stop-color="#070D17"/>
  </linearGradient>

  <linearGradient id="orangeCard" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1A1207"/>
    <stop offset="100%" stop-color="#0E0A06"/>
  </linearGradient>

  <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glowOrange" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32"
          fill="none"
          stroke="#334155"
          stroke-width="1"
          opacity=".08"/>
  </pattern>

</defs>


<!-- ========================================================= -->
<!-- BACKGROUND -->
<!-- ========================================================= -->

<rect width="1200" height="430" rx="18" fill="url(#bg)"/>
<rect width="1200" height="430" rx="18" fill="url(#grid)"/>


<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<text x="42" y="38"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="3"
      fill="#64748B">
  EXPERIENCE / EDUCATION
</text>

<text x="1158" y="38"
      text-anchor="end"
      font-family="Arial, Helvetica, sans-serif"
      font-size="10"
      letter-spacing="1.5"
      fill="#475569">
  2021 → NOW
</text>

<line x1="42" y1="54"
      x2="1158" y2="54"
      stroke="#1E293B"/>


<!-- ========================================================= -->
<!-- TIMELINE -->
<!-- ========================================================= -->

<!-- base -->

<line x1="150" y1="100"
      x2="1050" y2="100"
      stroke="#1E293B"
      stroke-width="3"/>


<!-- BTECH → GNCIPL : PURPLE -->

<line x1="150" y1="100"
      x2="450" y2="100"
      stroke="#7C3AED"
      stroke-width="2"
      stroke-dasharray="6 9"
      opacity=".65"/>

<line x1="150" y1="100"
      x2="450" y2="100"
      stroke="#C084FC"
      stroke-width="3"
      stroke-dasharray="2 30"
      stroke-linecap="round">

  <animate
    attributeName="stroke-dashoffset"
    values="0;-64"
    dur="2.2s"
    repeatCount="indefinite"/>

</line>


<!-- GNCIPL → SURE TRUST : BLUE -->

<line x1="450" y1="100"
      x2="750" y2="100"
      stroke="#2563EB"
      stroke-width="2"
      stroke-dasharray="6 9"
      opacity=".65"/>

<line x1="450" y1="100"
      x2="750" y2="100"
      stroke="#38BDF8"
      stroke-width="3"
      stroke-dasharray="2 30"
      stroke-linecap="round">

  <animate
    attributeName="stroke-dashoffset"
    values="0;-64"
    dur="2.4s"
    repeatCount="indefinite"/>

</line>


<!-- SURE TRUST → NOW : ORANGE -->

<line x1="750" y1="100"
      x2="1050" y2="100"
      stroke="#F59E0B"
      stroke-width="2"
      stroke-dasharray="6 9"
      opacity=".65"/>

<line x1="750" y1="100"
      x2="1050" y2="100"
      stroke="#FBBF24"
      stroke-width="3"
      stroke-dasharray="2 30"
      stroke-linecap="round">

  <animate
    attributeName="stroke-dashoffset"
    values="0;-64"
    dur="2.6s"
    repeatCount="indefinite"/>

</line>


<!-- ========================================================= -->
<!-- NODES -->
<!-- ========================================================= -->

<circle cx="150" cy="100"
        r="12"
        fill="#05070D"
        stroke="#22D3EE"
        stroke-width="2.5"
        filter="url(#glowCyan)"/>

<circle cx="150" cy="100"
        r="4"
        fill="#67E8F9"/>


<circle cx="450" cy="100"
        r="12"
        fill="#05070D"
        stroke="#8B5CF6"
        stroke-width="2.5"
        filter="url(#glowPurple)"/>

<circle cx="450" cy="100"
        r="4"
        fill="#C084FC"/>


<circle cx="750" cy="100"
        r="12"
        fill="#05070D"
        stroke="#3B82F6"
        stroke-width="2.5"
        filter="url(#glowBlue)"/>

<circle cx="750" cy="100"
        r="4"
        fill="#60A5FA"/>


<circle cx="1050" cy="100"
        r="13"
        fill="#05070D"
        stroke="#F59E0B"
        stroke-width="2.5"
        filter="url(#glowOrange)"/>

<circle cx="1050" cy="100"
        r="4"
        fill="#FBBF24">

  <animate
    attributeName="r"
    values="4;6;4"
    dur="1.8s"
    repeatCount="indefinite"/>

</circle>


<!-- ========================================================= -->
<!-- DATES -->
<!-- ========================================================= -->

<g font-family="Arial, Helvetica, sans-serif"
   font-size="10"
   font-weight="700">

  <text x="150" y="76"
        text-anchor="middle"
        fill="#22D3EE">
    2021 – 2025
  </text>

  <text x="450" y="76"
        text-anchor="middle"
        fill="#A78BFA">
    OCT – DEC 2025
  </text>

  <text x="750" y="76"
