<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience timeline: SURE Trust Python and ML internship, Global Next Consulting AI/ML internship with an honest note on a synthetic-to-real generalization gap found during evaluation, and B.Tech in Artificial Intelligence">
  <defs>
    <linearGradient id="ecard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <filter id="esh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#05070D"/>
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#374151" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 8">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="5s" repeatCount="indefinite"/>
  </line>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#E5E7EB">
    <circle cx="150" cy="70" r="8" fill="#22D3EE"/>
    <text x="150" y="45" text-anchor="middle" font-size="12" fill="#6B7280">SEP 2025 – MAY 2026 · REMOTE</text>
    <text x="150" y="100" text-anchor="middle" font-size="15" font-weight="700">SURE Trust</text>
    <text x="150" y="120" text-anchor="middle" font-size="11.5" fill="#93C5FD">Python &amp; ML Intern</text>

    <circle cx="490" cy="70" r="8" fill="#7C3AED"/>
    <text x="490" y="45" text-anchor="middle" font-size="12" fill="#6B7280">OCT – DEC 2025 · FULL-TIME</text>
    <text x="490" y="100" text-anchor="middle" font-size="15" font-weight="700">GNCIPL</text>
    <text x="490" y="120" text-anchor="middle" font-size="11.5" fill="#93C5FD">AI/ML Intern, Greater Noida</text>

    <circle cx="830" cy="70" r="8" fill="#8B5CF6"/>
    <text x="830" y="45" text-anchor="middle" font-size="12" fill="#6B7280">2021 – 2025</text>
    <text x="830" y="100" text-anchor="middle" font-size="15" font-weight="700">B.Tech, Artificial Intelligence</text>
    <text x="830" y="120" text-anchor="middle" font-size="11.5" fill="#93C5FD">ZHCET, AMU · CPI 8.22</text>

    <circle cx="1080" cy="70" r="9" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1080" y="45" text-anchor="middle" font-size="12" fill="#6B7280">NOW</text>
    <text x="1080" y="100" text-anchor="middle" font-size="15" font-weight="700">AI/ML Engineer role</text>
    <text x="1080" y="120" text-anchor="middle" font-size="11.5" fill="#93C5FD">+ MSc applications (EU)</text>
  </g>

  <!-- honest methodology callout -->
  <rect x="220" y="170" width="540" height="100" rx="12" fill="url(#ecard)" stroke="#F59E0B" stroke-opacity="0.4" filter="url(#esh)"/>
  <text x="244" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#F59E0B">METHODOLOGY NOTE — GNCIPL STROKE-RISK PROJECT</text>
  <text x="244" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E5E7EB">Used CTGAN to fix a 19.5:1 class imbalance, then found a</text>
  <text x="244" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E5E7EB">synthetic-to-real generalization gap — evaluation was redesigned</text>
  <text x="244" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E5E7EB">to separate augmented vs. untouched real-data performance.</text>
</svg>
