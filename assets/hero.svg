<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maaz Mahboob — computer vision and medical AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1712"/>
      <stop offset="100%" stop-color="#14110D"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C98A4B"/>
      <stop offset="100%" stop-color="#5C7A78"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#16130F" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#16130F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#16130F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#4A443B" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .name { font-family: Georgia, 'Times New Roman', serif; }
    .word { font-size: 15px; letter-spacing: 2px; }
    .amber { fill: #C98A4B; }
    .teal { fill: #5C7A78; }
    .clay { fill: #A8613F; }
    .w1 { animation: fall 24s linear infinite; animation-delay: 0s; }
    .w2 { animation: fall 24s linear infinite; animation-delay: -4s; }
    .w3 { animation: fall 24s linear infinite; animation-delay: -8s; }
    .w4 { animation: fall 24s linear infinite; animation-delay: -12s; }
    .w5 { animation: fall 24s linear infinite; animation-delay: -16s; }
    .w6 { animation: fall 24s linear infinite; animation-delay: -20s; }
    .w7 { animation: fall 24s linear infinite; animation-delay: -2s; }
    @keyframes fall {
      0%   { transform: translateY(-30px); opacity: 0; }
      10%  { opacity: 0.45; }
      82%  { opacity: 0.35; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    .pulse { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.42; }
    }
    .arrow { animation: bob 2.8s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); opacity: 0.5; }
      50% { transform: translateY(6px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .w1, .w2, .w3, .w4, .w5, .w6, .w7, .pulse, .arrow { animation: none; }
      .w1, .w2, .w3, .w4, .w5, .w6, .w7 { opacity: 0; }
      .pulse { opacity: 0.22; }
      .arrow { opacity: 0.8; }
    }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>

  <g>
    <text x="80"   y="0" class="word amber w1">vision</text>
    <text x="200"  y="0" class="word teal  w2">retrieval</text>
    <text x="1000" y="0" class="word amber w3">signal</text>
    <text x="1130" y="0" class="word teal  w4">calibration</text>
    <text x="640"  y="0" class="word clay  w5">care</text>
    <text x="40"   y="0" class="word teal  w6">detection</text>
    <text x="1160" y="0" class="word amber w7">focus</text>
  </g>

  <rect width="1200" height="340" fill="url(#spot)"/>

  <path class="pulse" d="M120,148 L430,148 L452,120 L472,176 L494,148 L1080,148"
        fill="none" stroke="#9E9484" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="82" text-anchor="middle" class="mist" font-size="12" letter-spacing="3" fill="#9E9484">COMPUTER VISION &#183; MEDICAL AI</text>

  <text x="600" y="158" text-anchor="middle" class="name" font-size="44" fill="#EDE6D9">Maaz Mahboob</text>

  <text x="600" y="192" text-anchor="middle" font-size="16" fill="#9E9484">Computer vision and medical AI. Building systems that fail safely.</text>

  <text x="600" y="224" text-anchor="middle" font-size="12.5" fill="#8C8377">Aligarh, India &#183; B.Tech AI, AMU &#183; open to research collaboration</text>

  <g class="arrow" transform="translate(600,268)">
    <path d="M-9,-6 L0,4 L9,-6" fill="none" stroke="url(#arrowGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="26" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8C8377">FOCUS AREAS</text>
  </g>
</svg>
