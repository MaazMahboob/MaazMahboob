<svg width="1200" height="440" viewBox="0 0 1200 440"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Maaz Mahboob, AI/ML Engineer specializing in computer vision, LLM and retrieval-augmented generation systems">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="48%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0A0B18"/>
    </linearGradient>

    <radialGradient id="cyanAtmosphere">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetAtmosphere">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- NAME -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8FBFF"/>
      <stop offset="34%" stop-color="#67E8F9"/>
      <stop offset="68%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>

    <!-- AI CORE -->
    <radialGradient id="coreGradient">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#67E8F9"/>
      <stop offset="36%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.5"/>
    </linearGradient>

    <!-- TECHNICAL GRID -->
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#334155"
            stroke-width="0.7"
            opacity="0.12"/>
    </pattern>

    <pattern id="dotField" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8"
              fill="#64748B"
              opacity="0.28"/>
    </pattern>

    <!-- GLOW -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="180%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.45"/>
    </filter>

    <!-- CINEMATIC LIGHT SWEEP -->
    <linearGradient id="lightSweep"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#67E8F9" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- BASE -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#microGrid)"/>
  <rect width="1200" height="440" fill="url(#dotField)" opacity="0.42"/>


  <!-- ATMOSPHERIC LIGHT -->
  <circle cx="1040"
          cy="105"
          r="330"
          fill="url(#violetAtmosphere)"/>

  <circle cx="80"
          cy="370"
          r="300"
          fill="url(#cyanAtmosphere)"/>


  <!-- CINEMATIC AMBIENT ORBITS -->
  <g opacity="0.45">

    <circle cx="1010"
            cy="105"
            r="155"
            fill="none"
            stroke="#7C3AED"
            stroke-width="1"
            stroke-opacity="0.12">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 1010 105"
        to="360 1010 105"
        dur="24s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1010"
            cy="105"
            r="120"
            fill="none"
            stroke="#22D3EE"
            stroke-width="1"
            stroke-opacity="0.10">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 1010 105"
        to="0 1010 105"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- TOP TECHNICAL LABEL -->

  <g font-family="JetBrains Mono, Consolas, monospace">

    <text x="60"
          y="46"
          font-size="10.5"
          letter-spacing="3"
          fill="#64748B">
      APPLIED ARTIFICIAL INTELLIGENCE
    </text>

    <circle cx="300"
            cy="42"
            r="2.5"
            fill="#22D3EE"
            filter="url(#glow)">

      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>

    <text x="1140"
          y="46"
          text-anchor="end"
          font-size="10"
          letter-spacing="2"
          fill="#475569">
      AI / ML ENGINEERING
    </text>

  </g>


  <!-- IDENTITY -->

  <g>

    <text x="60"
          y="154"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="66"
          font-weight="800"
          letter-spacing="-2"
          fill="url(#nameGradient)">
      MAAZ MAHBOOB
    </text>


    <!-- SUBTLE NAME LIGHT SWEEP -->

    <rect x="-420"
          y="82"
          width="280"
          height="92"
          fill="url(#lightSweep)"
          opacity="0.55">

      <animate
        attributeName="x"
        values="-420;1180"
        dur="8s"
        repeatCount="indefinite"/>

    </rect>


    <text x="64"
          y="194"
          font-family="JetBrains Mono, Consolas, monospace"
          font-size="17"
          letter-spacing="1.1"
          fill="#F1F5F9">

      AI/ML ENGINEER

      <tspan fill="#475569"> · </tspan>

      <tspan fill="#67E8F9">
        COMPUTER VISION
      </tspan>

      <tspan fill="#475569"> · </tspan>

      <tspan fill="#C4B5FD">
        LLM / RAG
      </tspan>

    </text>


    <text x="64"
          y="230"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="15"
          fill="#94A3B8">
      Building applied AI systems across computer vision,
    </text>

    <text x="64"
          y="252"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="15"
          fill="#94A3B8">
      retrieval-grounded LLMs, and machine learning.
    </text>

  </g>


  <!-- PROOF POINTS -->

  <g font-family="JetBrains Mono, Consolas, monospace">


    <!-- 15,000 X-RAY IMAGES -->

    <g filter="url(#shadow)">

      <rect x="62"
            y="285"
            width="170"
            height="58"
            rx="12"
            fill="url(#glass)"
            stroke="#22D3EE"
            stroke-opacity="0.28"/>

      <rect x="62"
            y="285"
            width="3"
            height="58"
            rx="1.5"
            fill="#22D3EE"/>

      <text x="82"
            y="310"
            font-size="18"
            font-weight="700"
            fill="#67E8F9">
        15,000
      </text>

      <text x="82"
            y="328"
            font-size="9.5"
            letter-spacing="1"
            fill="#64748B">
        X-RAY IMAGES
      </text>

    </g>


    <!-- RAG -->

    <g filter="url(#shadow)">

      <rect x="246"
            y="285"
            width="190"
            height="58"
            rx="12"
            fill="url(#glass)"
            stroke="#8B5CF6"
            stroke-opacity="0.30"/>

      <rect x="246"
            y="285"
            width="3"
            height="58"
            rx="1.5"
            fill="#8B5CF6"/>

      <text x="266"
            y="310"
            font-size="18"
            font-weight="700"
            fill="#C4B5FD">
        83.7%
      </text>

      <text x="266"
            y="328"
            font-size="9.5"
            letter-spacing="1"
            fill="#64748B">
        RAG WIN RATE
      </text>

    </g>


    <!-- PUBLICATIONS -->

    <g filter="url(#shadow)">

      <rect x="450"
            y="285"
            width="170"
            height="58"
            rx="12"
            fill="url(#glass)"
            stroke="#06B6D4"
            stroke-opacity="0.30"/>

      <rect x="450"
            y="285"
            width="3"
            height="58"
            rx="1.5"
            fill="#06B6D4"/>

      <text x="470"
            y="310"
            font-size="18"
            font-weight="700"
            fill="#67E8F9">
        3
      </text>

      <text x="470"
            y="328"
            font-size="9.5"
            letter-spacing="1"
            fill="#64748B">
        PUBLICATIONS
      </text>

    </g>

  </g>


  <!-- AI CORE VISUAL -->

  <g transform="translate(900 206)">


    <!-- ATMOSPHERIC CORE -->

    <circle cx="0"
            cy="0"
            r="138"
            fill="#7C3AED"
            opacity="0.035"
            filter="url(#softGlow)">

      <animate
        attributeName="r"
        values="128;142;128"
        dur="5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ORBITAL RINGS -->

    <ellipse cx="0"
             cy="0"
             rx="135"
             ry="62"
             fill="none"
             stroke="#22D3EE"
             stroke-opacity="0.14"
             stroke-width="1"/>

    <ellipse cx="0"
             cy="0"
             rx="135"
             ry="62"
             fill="none"
             stroke="#8B5CF6"
             stroke-opacity="0.13"
             stroke-width="1"
             transform="rotate(60)"/>

    <ellipse cx="0"
             cy="0"
             rx="135"
             ry="62"
             fill="none"
             stroke="#67E8F9"
             stroke-opacity="0.10"
             stroke-width="1"
             transform="rotate(-60)"/>


    <!-- ORBITAL NODES -->

    <circle cx="135"
            cy="0"
            r="4"
            fill="#22D3EE"
            filter="url(#glow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="7s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="-67"
            cy="-58"
            r="3.5"
            fill="#A78BFA"
            filter="url(#glow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 0 0"
        to="0 0 0"
        dur="9s"
        repeatCount="indefinite"/>

    </circle>


    <!-- CONNECTIONS -->

    <g stroke-width="1.2"
       fill="none">

      <path d="M-98 -58 L-30 -18"
            stroke="#22D3EE"
            stroke-opacity="0.5"/>

      <path d="M98 -58 L30 -18"
            stroke="#8B5CF6"
            stroke-opacity="0.5"/>

      <path d="M-98 58 L-30 18"
            stroke="#22D3EE"
            stroke-opacity="0.35"/>

      <path d="M98 58 L30 18"
            stroke="#8B5CF6"
            stroke-opacity="0.35"/>

    </g>


    <!-- VISION NODE -->

    <g filter="url(#shadow)">

      <rect x="-148"
            y="-82"
            width="94"
            height="42"
            rx="10"
            fill="#0B111A"
            stroke="#22D3EE"
            stroke-opacity="0.45"/>

      <text x="-101"
            y="-58"
            text-anchor="middle"
            font-family="JetBrains Mono, Consolas, monospace"
            font-size="9"
            letter-spacing="1"
            fill="#67E8F9">
        VISION
      </text>

    </g>


    <!-- RAG NODE -->

    <g filter="url(#shadow)">

      <rect x="54"
            y="-82"
            width="94"
            height="42"
            rx="10"
            fill="#0D0B18"
            stroke="#8B5CF6"
            stroke-opacity="0.45"/>

      <text x="101"
            y="-58"
            text-anchor="middle"
            font-family="JetBrains Mono, Consolas, monospace"
            font-size="9"
            letter-spacing="1"
            fill="#C4B5FD">
        LLM / RAG
      </text>

    </g>


    <!-- ML NODE -->

    <g filter="url(#shadow)">

      <rect x="-148"
            y="40"
            width="94"
            height="42"
            rx="10"
            fill="#0B111A"
            stroke="#06B6D4"
            stroke-opacity="0.38"/>

      <text x="-101"
            y="65"
            text-anchor="middle"
            font-family="JetBrains Mono, Consolas, monospace"
            font-size="9"
            letter-spacing="1"
            fill="#67E8F9">
        ML
      </text>

    </g>


    <!-- AI ENGINEERING NODE -->

    <g filter="url(#shadow)">

      <rect x="54"
            y="40"
            width="94"
            height="42"
            rx="10"
            fill="#0D0B18"
            stroke="#A78BFA"
            stroke-opacity="0.35"/>

      <text x="101"
            y="65"
            text-anchor="middle"
            font-family="JetBrains Mono, Consolas, monospace"
            font-size="9"
            letter-spacing="1"
            fill="#C4B5FD">
        AI ENG
      </text>

    </g>


    <!-- CORE -->

    <circle cx="0"
            cy="0"
            r="48"
            fill="url(#coreGradient)"
            opacity="0.28"
            filter="url(#softGlow)">

      <animate
        attributeName="opacity"
        values="0.18;0.34;0.18"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="0"
            cy="0"
            r="29"
            fill="#071019"
            stroke="url(#glassEdge)"
            stroke-width="1.5"
            filter="url(#shadow)"/>


    <circle cx="0"
            cy="0"
            r="8"
            fill="#E0FBFF"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="7;10;7"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>


    <text x="0"
          y="4"
          text-anchor="middle"
          font-family="JetBrains Mono, Consolas, monospace"
          font-size="7.5"
          letter-spacing="1"
          fill="#E0FBFF">
      CORE
    </text>


    <!-- DATA PARTICLES -->

    <g fill="#67E8F9"
       filter="url(#glow)">

      <circle cx="-112"
              cy="0"
              r="2">

        <animate
          attributeName="cx"
          values="-112;-40;-112"
          dur="3.2s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="112"
              cy="0"
              r="2">

        <animate
          attributeName="cx"
          values="112;40;112"
          dur="3.6s"
          repeatCount="indefinite"/>

      </circle>

    </g>

  </g>


  <!-- BOTTOM IDENTITY STRIP -->

  <line x1="60"
        y1="372"
        x2="1140"
        y2="372"
        stroke="#334155"
        stroke-opacity="0.45"/>


  <g font-family="JetBrains Mono, Consolas, monospace"
     font-size="10.5"
     letter-spacing="1">

    <text x="60"
          y="398"
          fill="#64748B">
      ZHCET · AMU
    </text>

    <text x="190"
          y="398"
          fill="#475569">
      /
    </text>

    <text x="210"
          y="398"
          fill="#64748B">
      B.TECH ARTIFICIAL INTELLIGENCE
    </text>

    <text x="505"
          y="398"
          fill="#475569">
      /
    </text>

    <text x="525"
          y="398"
          fill="#67E8F9">
      CPI 8.22
    </text>

    <text x="640"
          y="398"
          fill="#475569">
      /
    </text>

    <text x="660"
          y="398"
          fill="#64748B">
      2021 — 2025
    </text>

    <text x="1140"
          y="398"
          text-anchor="end"
          fill="#94A3B8">
      OPEN TO AI / ML ENGINEERING ROLES
    </text>

  </g>


  <!-- CINEMATIC EDGE -->

  <rect x="0"
        y="0"
        width="1200"
        height="440"
        fill="none"
        stroke="#1E293B"
        stroke-width="1"/>

  <rect x="1"
        y="1"
        width="1198"
        height="438"
        rx="2"
        fill="none"
        stroke="url(#glassEdge)"
        stroke-opacity="0.10"/>

</svg>
