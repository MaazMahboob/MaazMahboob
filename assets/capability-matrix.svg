  y="34"
  text-anchor="middle"
  font-family="JetBrains Mono,Consolas,monospace"
  font-size="9.5"
  letter-spacing="4"
  fill="#64748B">
  AI ENGINEERING / CAPABILITY SYSTEM
</text>

