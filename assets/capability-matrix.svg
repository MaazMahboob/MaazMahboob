      type="rotate"
      from="0 600 310"
      to="360 600 310"
      dur="16s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Core -->
  <circle
    cx="600"
    cy="310"
    r="65"
    fill="#080D14"
    stroke="url(#coreGradient)"
    stroke-width="1.5"
    stroke-opacity=".7"/>


