    cx="600"
    cy="310"
    r="17"
    fill="url(#coreGradient)"
    opacity=".20"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="13;24;13"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Core point -->
