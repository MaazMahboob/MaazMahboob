<svg width="1200" height="620" viewBox="0 0 1200 620"
xmlns="http://www.w3.org/2000/svg"
role="img"
aria-label="Technical capabilities across computer vision, LLM and RAG, machine learning, and AI engineering">

<defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#030509"/>
    <stop offset="48%" stop-color="#070B12"/>
    <stop offset="100%" stop-color="#0A0A12"/>
  </linearGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path
      d="M32 0H0V32"
      fill="none"
      stroke="#334155"
      stroke-width="1"
      opacity=".07"/>
  </pattern>

  <!-- ========================================================= -->
  <!-- COLOR SYSTEM -->
  <!-- ========================================================= -->

  <linearGradient id="cv" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>

  <linearGradient id="rag" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C4B5FD"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="ml" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FDE68A"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>

  <linearGradient id="eng" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A7F3D0"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>

  <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>

  <!-- ========================================================= -->
  <!-- AMBIENT GLOW -->
  <!-- ========================================================= -->

  <radialGradient id="coreGlow">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".20"/>
    <stop offset="35%" stop-color="#22D3EE" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="violetGlow">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <!-- ========================================================= -->
  <!-- EFFECTS -->
  <!-- ========================================================= -->

  <filter id="shadow"
          x="-40%" y="-40%"
          width="180%" height="180%">
    <feDropShadow
      dx="0"
      dy="12"
      stdDeviation="18"
      flood-color="#000000"
      flood-opacity=".55"/>
  </filter>

  <filter id="glow"
          x="-100%" y="-100%"
          width="300%" height="300%">
    <feGaussianBlur
      stdDeviation="5"
      result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="smallGlow"
          x="-100%" y="-100%"
          width="300%" height="300%">
    <feGaussianBlur
      stdDeviation="2.5"
      result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ========================================================= -->
<!-- CANVAS -->
<!-- ========================================================= -->

<rect width="1200" height="620" fill="url(#bg)"/>
<rect width="1200" height="620" fill="url(#grid)"/>

<circle
  cx="600"
  cy="310"
  r="330"
  fill="url(#coreGlow)">

  <animate
    attributeName="r"
    values="300;345;300"
    dur="9s"
    repeatCount="indefinite"/>

</circle>

<circle
  cx="80"
  cy="120"
  r="240"
  fill="url(#cyanGlow)"/>

<circle
  cx="1120"
  cy="120"
  r="240"
  fill="url(#violetGlow)"/>


<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<text
