<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI capability matrix across five categories: computer vision, LLM and generative AI, machine learning and data science, AI engineering and deployment, and programming and databases">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#05070D"/>
  <text x="600" y="34" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="4" fill="#6B7280">AI CAPABILITY MATRIX</text>

  <!-- Row 1 -->
  <g>
    <rect x="30" y="56" width="278" height="200" rx="14" fill="url(#card)" stroke="#22D3EE" stroke-opacity="0.35" filter="url(#sh)"/>
    <rect x="30" y="56" width="278" height="4" rx="2" fill="#22D3EE"/>
    <circle cx="56" cy="86" r="9" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="56" cy="86" r="3" fill="#22D3EE"/>
    <text x="74" y="91" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#22D3EE">COMPUTER VISION</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E5E7EB">
      <text x="50" y="122">YOLOv11 / YOLOv12</text>
      <text x="50" y="148">Faster R-CNN (Detectron2)</text>
      <text x="50" y="174">OpenCV · MediaPipe</text>
      <text x="50" y="200">CNNs · Transfer Learning</text>
      <text x="50" y="226">Medical Imaging</text>
    </g>
  </g>

  <g>
    <rect x="322" y="56" width="278" height="200" rx="14" fill="url(#card)" stroke="#8B5CF6" stroke-opacity="0.35" filter="url(#sh)"/>
    <rect x="322" y="56" width="278" height="4" rx="2" fill="#8B5CF6"/>
    <circle cx="348" cy="86" r="9" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="348" cy="86" r="3" fill="#8B5CF6"/>
    <text x="366" y="91" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#8B5CF6">LLM &amp; GENERATIVE AI</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E5E7EB">
      <text x="342" y="122">LangGraph · RAG pipelines</text>
      <text x="342" y="148">PubMedBERT · Transformers</text>
      <text x="342" y="174">Ollama (local inference)</text>
      <text x="342" y="200">Prompt Engineering</text>
      <text x="342" y="226">Structured LLM Output</text>
    </g>
  </g>

  <g>
    <rect x="614" y="56" width="278" height="200" rx="14" fill="url(#card)" stroke="#06B6D4" stroke-opacity="0.35" filter="url(#sh)"/>
    <rect x="614" y="56" width="278" height="4" rx="2" fill="#06B6D4"/>
    <circle cx="640" cy="86" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="640" cy="86" r="3" fill="#06B6D4"/>
    <text x="658" y="91" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#06B6D4">MACHINE LEARNING</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E5E7EB">
      <text x="634" y="122">Scikit-learn · XGBoost</text>
      <text x="634" y="148">Random Forest · Logistic Reg.</text>
      <text x="634" y="174">CTGAN (imbalance handling)</text>
      <text x="634" y="200">Feature Engineering</text>
      <text x="634" y="226">Pandas · NumPy · EDA</text>
    </g>
  </g>

  <g>
    <rect x="906" y="56" width="264" height="200" rx="14" fill="url(#card)" stroke="#7C3AED" stroke-opacity="0.4" filter="url(#sh)"/>
    <rect x="906" y="56" width="264" height="4" rx="2" fill="#7C3AED"/>
    <circle cx="932" cy="86" r="9" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="932" cy="86" r="3" fill="#7C3AED"/>
    <text x="950" y="91" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#7C3AED">AI ENGINEERING</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E5E7EB">
      <text x="926" y="122">FastAPI · Pydantic</text>
      <text x="926" y="148">JWT / OAuth2</text>
      <text x="926" y="174">PostgreSQL · Alembic</text>
      <text x="926" y="200">Celery · Docker Compose</text>
      <text x="926" y="226">Git / GitHub</text>
    </g>
  </g>

  <!-- Row 2: languages strip -->
  <g>
    <rect x="30" y="278" width="1140" height="72" rx="14" fill="url(#card)" stroke="#374151" stroke-opacity="0.5" filter="url(#sh)"/>
    <text x="56" y="308" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#6B7280">CORE LANGUAGES &amp; DATA</text>
    <text x="56" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E5E7EB">Python · SQL · PostgreSQL · Statistical Analysis · Model Evaluation</text>
  </g>

  <text x="600" y="490" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4B5563">EVERY ITEM HERE SHIPPED IN A PROJECT, RESEARCH PAPER, OR PRODUCTION PIPELINE</text>
</svg>
